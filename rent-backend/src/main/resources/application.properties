# Server
server.port=${SERVER_PORT:8080}

# Datasource
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Cookie Configuration
app.cookie.secure=${COOKIE_SECURE:false}
app.cookie.same-site=${COOKIE_SAME_SITE:Lax}
app.cookie.max-age-days=${COOKIE_MAX_AGE_DAYS:7}

# Razorpay
razorpay.key.id=${RAZORPAY_KEY_ID}
razorpay.key.secret=${RAZORPAY_KEY_SECRET}

# CORS — comma-separated list of allowed origins (use * to allow all)
# Example: http://localhost:5173,https://your-replit-preview.replit.dev
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}

# Logging
logging.level.com.rentafurniture=INFO
logging.level.org.springframework.security=WARN
